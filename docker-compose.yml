version: '3.8'

services:

 sshtunnel:
  image: likinio365/sshtunnel:latest
  network_mode: "host"
  restart: always
  volumes:
    - ~/mycustomtunnel/data/:/data/:ro
  environment:
    - H=1
    - REMOTE=true
    - TUNNEL_HOST=10.1.1.198,10.1.2.199
    - REMOTE_PORT=443,443
    - REMOTE_HOST=10.1.1.74,10.2.1.75
    - LOCAL_PORT=998,999
    - KEY=/data/id_rsa
 healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 998 && nc -z 127.0.0.1 999"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
